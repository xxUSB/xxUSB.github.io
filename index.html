<html>
  <head>
    <style>
      body {
        background: #efefef;
        color: #000;
        font-family: Arial, Verdana, Roboto, sans-serif;
        margin: 0px;
      }

      .nav-bar {
        background: #fff;
        height: 30px;
        position: sticky;
        align-content: center;
        padding: 5px 30px;
        top: 0px;
        left: 0px;
        right: 0px;
        z-index: 1000;
      }

      ped {
        display: block;
        padding: 20px 0px;
      }

      #sbbtn {
        background-color: #3333ff;
        color: #ffffff;
        width: 75px;
        height: 75px;
        border-radius: 70px;
        border: 2.5px solid #6666ff;
        box-shadow: 6px 6px 15px #00000044;
        transition: all 0.2s ease;
      }

      #sbbtn:hover {
        background-color: #1111dd;
        color: #ffffff;
        width: 75px;
        height: 75px;
        border-radius: 70px;
        border: 2.5px solid #4444dd;
        box-shadow: 3px 3px 15px #00000088;
        transform: translateY(2.5px);
      }

      app {
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar"><strong> USB </strong></div>
    <ped>
    <app>
        <button id="sbbtn" sound="1">GET OUT</button>
    </app>
    <script>
    const button = document.getElementById('sbbtn');
    if (button) { button.addEventListener('click', (event) => { 
        const id = event.currentTarget.getAttribute('sound'); 
        new Audio(`/sounds/${id}.mp3`).play(); 
      });
    }
    </script>
  </body>
</html>
